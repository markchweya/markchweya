name: Puzzle move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: puzzle

jobs:
  place:
    if: ${{ startsWith(github.event.issue.title, 'puzzle|place|') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply move
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: python3 game/puzzle.py place "$TITLE" "$PLAYER"

      - name: Commit board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/puzzle-board.svg game/state.json
          if ! git diff --cached --quiet; then
            git commit -m "🧩 puzzle move by @$PLAYER"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file game/last_move.txt --repo ${{ github.repository }}
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
