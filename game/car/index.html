<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chweya Drift</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  canvas{max-height:100vh;max-width:100vw;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="420" height="640"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const ROAD_X = 60, ROAD_W = W - 120;
const LANES = [ROAD_X + ROAD_W / 6, ROAD_X + ROAD_W / 2, ROAD_X + ROAD_W * 5 / 6];
const CAR_W = 54, CAR_H = 92;
const PLAYER_Y = H - 150;

let state = 'menu';           // menu | play | over
let lane = 1, px = LANES[1];
let obstacles = [], dashOff = 0;
let speed, score, spawnT, best = 0;
try { best = +localStorage.getItem('chweya-drift-best') || 0; } catch (e) {}

function reset() {
  lane = 1; px = LANES[1];
  obstacles = [];
  speed = 280; score = 0; spawnT = 0.4;
  state = 'play';
}

function steer(dir) {
  if (state !== 'play') return;
  lane = Math.max(0, Math.min(2, lane + dir));
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') steer(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') steer(1);
  else if (e.key === ' ' || e.key === 'Enter') { if (state !== 'play') reset(); }
});
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { reset(); return; }
  const r = cv.getBoundingClientRect();
  steer((e.clientX - r.left) / r.width < 0.5 ? -1 : 1);
});

const OB_COLORS = ['#ef4444', '#f59e0b', '#10b981', '#64748b', '#e2e8f0'];
function spawn() {
  const two = Math.random() < 0.35;
  const free = Math.floor(Math.random() * 3);           // always leave one lane open
  for (let l = 0; l < 3; l++) {
    if (l === free) continue;
    if (!two && Math.random() < 0.5) continue;
    obstacles.push({
      lane: l, y: -CAR_H - Math.random() * 60,
      cone: Math.random() < 0.25,
      color: OB_COLORS[Math.floor(Math.random() * OB_COLORS.length)]
    });
  }
  if (!obstacles.length) spawn();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCar(x, y, color, isPlayer) {
  ctx.save();
  ctx.translate(x, y);
  if (isPlayer) {
    const g = ctx.createLinearGradient(-CAR_W / 2, 0, CAR_W / 2, 0);
    g.addColorStop(0, '#38bdf8'); g.addColorStop(1, '#a78bfa');
    ctx.fillStyle = g;
    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 18;
  } else {
    ctx.fillStyle = color;
  }
  roundRect(-CAR_W / 2, -CAR_H / 2, CAR_W, CAR_H, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(13,17,23,0.55)';
  roundRect(-CAR_W / 2 + 8, -CAR_H / 2 + 14, CAR_W - 16, 22, 6); ctx.fill();
  roundRect(-CAR_W / 2 + 8, CAR_H / 2 - 32, CAR_W - 16, 18, 6); ctx.fill();
  ctx.restore();
}

function drawCone(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(20, 22); ctx.lineTo(-20, 22); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(-11, -2, 22, 8);
  ctx.restore();
}

function drawRoad() {
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#161b22'; ctx.fillRect(ROAD_X, 0, ROAD_W, H);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(ROAD_X - 6, 0, 4, H);
  ctx.fillStyle = '#a78bfa'; ctx.fillRect(ROAD_X + ROAD_W + 2, 0, 4, H);
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 4; ctx.setLineDash([28, 26]);
  ctx.lineDashOffset = -dashOff;
  for (const fx of [ROAD_X + ROAD_W / 3, ROAD_X + ROAD_W * 2 / 3]) {
    ctx.beginPath(); ctx.moveTo(fx, 0); ctx.lineTo(fx, H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function hud() {
  ctx.fillStyle = '#f0f6fc'; ctx.font = '700 22px "Segoe UI",sans-serif';
  ctx.textAlign = 'left'; ctx.fillText(Math.floor(score), 14, 32);
  ctx.fillStyle = '#64748b'; ctx.font = '600 14px "Segoe UI",sans-serif';
  ctx.textAlign = 'right'; ctx.fillText('BEST ' + Math.floor(best), W - 14, 30);
}

function overlay(title, sub1, sub2) {
  ctx.fillStyle = 'rgba(13,17,23,0.82)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const g = ctx.createLinearGradient(W / 2 - 130, 0, W / 2 + 130, 0);
  g.addColorStop(0, '#38bdf8'); g.addColorStop(1, '#a78bfa');
  ctx.fillStyle = g; ctx.font = '800 44px "Segoe UI",sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.fillStyle = '#cbd5e1'; ctx.font = '600 18px "Segoe UI",sans-serif';
  ctx.fillText(sub1, W / 2, H / 2 - 8);
  ctx.fillStyle = '#64748b'; ctx.font = '600 15px "Segoe UI",sans-serif';
  ctx.fillText(sub2, W / 2, H / 2 + 28);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (state === 'play') {
    speed = Math.min(720, speed + 9 * dt);
    score += speed * dt * 0.02;
    dashOff += speed * dt;
    px += (LANES[lane] - px) * Math.min(1, dt * 14);

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.55, 170 / speed); }

    for (const o of obstacles) o.y += speed * dt;
    obstacles = obstacles.filter(o => o.y < H + CAR_H);

    for (const o of obstacles) {
      const ow = o.cone ? 34 : CAR_W * 0.86, oh = o.cone ? 44 : CAR_H * 0.9;
      if (Math.abs(LANES[o.lane] - px) < (ow + CAR_W * 0.86) / 2 &&
          Math.abs(o.y - PLAYER_Y) < (oh + CAR_H * 0.9) / 2) {
        state = 'over';
        best = Math.max(best, Math.floor(score));
        try { localStorage.setItem('chweya-drift-best', best); } catch (e) {}
      }
    }
  }

  drawRoad();
  for (const o of obstacles) o.cone ? drawCone(LANES[o.lane], o.y) : drawCar(LANES[o.lane], o.y, o.color, false);
  if (state !== 'menu') drawCar(px, PLAYER_Y, null, true);
  hud();

  if (state === 'menu') overlay('CHWEYA DRIFT', 'Switch lanes. Dodge traffic.', 'SPACE or tap to start · steer with ← → or tap sides');
  if (state === 'over') overlay('CRASHED', 'Score ' + Math.floor(score) + '  ·  Best ' + Math.floor(best), 'SPACE or tap to try again');

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
