<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridmask">
      <rect width="1200" height="320" fill="url(#fade)" />
    </mask>
  </defs>

  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridmask)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="66" font-size="15" font-weight="600" letter-spacing="7" fill="#64748b">~ / MARKCHWEYA</text>

    <!-- letter tiles: M A R K   C H W E Y A -->
    <g font-size="42" font-weight="800" fill="#f0f6fc">
      <g transform="translate(0,-80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -80; 0 6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.15s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.15s" fill="freeze" />
        <rect x="183" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="219" y="151">M</text>
      </g>
      <g transform="translate(0,80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 80; 0 -6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.24s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.24s" fill="freeze" />
        <rect x="265" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="301" y="151">A</text>
      </g>
      <g transform="translate(0,-80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -80; 0 6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.33s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.33s" fill="freeze" />
        <rect x="347" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="383" y="151">R</text>
      </g>
      <g transform="translate(0,80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 80; 0 -6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.42s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.42s" fill="freeze" />
        <rect x="429" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="465" y="151">K</text>
      </g>
      <g transform="translate(0,-80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -80; 0 6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.51s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.51s" fill="freeze" />
        <rect x="535" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="571" y="151">C</text>
      </g>
      <g transform="translate(0,80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 80; 0 -6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.6s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze" />
        <rect x="617" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="653" y="151">H</text>
      </g>
      <g transform="translate(0,-80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -80; 0 6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.69s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.69s" fill="freeze" />
        <rect x="699" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="735" y="151">W</text>
      </g>
      <g transform="translate(0,80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 80; 0 -6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.78s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.78s" fill="freeze" />
        <rect x="781" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="817" y="151">E</text>
      </g>
      <g transform="translate(0,-80)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -80; 0 6; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.55s" begin="0.87s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.87s" fill="freeze" />
        <rect x="863" y="100" width="72" height="72" rx="14" fill="#161b22" stroke="#30363d" />
        <text x="899" y="151">Y</text>
      </g>
      <!-- the missing piece -->
      <g transform="translate(0,-110)" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 -110; 0 8; 0 0" keyTimes="0;0.75;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.6s" begin="1.25s" fill="freeze" />
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.25s" fill="freeze" />
        <g transform="rotate(-10 981 136)">
          <animateTransform attributeName="transform" type="rotate" values="-10 981 136; 4 981 136; 0 981 136" keyTimes="0;0.75;1" dur="0.6s" begin="1.25s" fill="freeze" />
          <rect x="945" y="100" width="72" height="72" rx="14" fill="url(#accent)" />
          <text x="981" y="151" fill="#0d1117">A</text>
        </g>
      </g>
    </g>

    <text x="600" y="248" font-size="19" fill="#94a3b8">Building AI products and modern digital experiences</text>

    <g font-size="14" font-weight="600" letter-spacing="5" fill="url(#accent)">
      <text x="600" y="288" opacity="0">SOFTWARE DEVELOPER
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="0s" repeatCount="indefinite" />
      </text>
      <text x="600" y="288" opacity="0">AI BUILDER
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="4s" repeatCount="indefinite" />
      </text>
      <text x="600" y="288" opacity="0">DATA SCIENTIST
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="8s" repeatCount="indefinite" />
      </text>
      <text x="600" y="288" opacity="0">DATA ANALYST
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="12s" repeatCount="indefinite" />
      </text>
    </g>
  </g>
</svg>
