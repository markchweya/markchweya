<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#7c3aed;#0284c7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#0284c7;#7c3aed" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#cbd5e1" stroke-width="1" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridmask">
      <rect width="1200" height="320" fill="url(#fade)" />
    </mask>
  </defs>

  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridmask)" />

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">

    <!-- jigsaw pieces: MARK | CHWEYA, tabs interlock into neighbouring sockets -->
    <g font-size="44" font-weight="800" fill="#0f172a" stroke-width="1.5">
      <!-- M : flat left, tab right -->
      <g opacity="0" transform="translate(0,-34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.15s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 -34; 0 5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.15s" fill="freeze" />
        <g transform="rotate(-7 175 133)">
          <animateTransform attributeName="transform" type="rotate" values="-7 175 133; 3 175 133; 0 175 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.15s" fill="freeze" />
          <path d="M 130 88 L 220 88 L 220 120 A 13 13 0 0 1 220 146 L 220 178 L 130 178 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="175" y="149" stroke="none">M</text>
        </g>
      </g>
      <!-- A : socket left, tab right -->
      <g opacity="0" transform="translate(0,34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.51s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.51s" fill="freeze" />
        <g transform="rotate(6 265 133)">
          <animateTransform attributeName="transform" type="rotate" values="6 265 133; -3 265 133; 0 265 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.51s" fill="freeze" />
          <path d="M 220 88 L 310 88 L 310 120 A 13 13 0 0 1 310 146 L 310 178 L 220 178 L 220 146 A 13 13 0 0 0 220 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="265" y="149" stroke="none">A</text>
        </g>
      </g>
      <!-- R : socket left, tab right -->
      <g opacity="0" transform="translate(0,34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.27s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.27s" fill="freeze" />
        <g transform="rotate(-6 355 133)">
          <animateTransform attributeName="transform" type="rotate" values="-6 355 133; 3 355 133; 0 355 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.27s" fill="freeze" />
          <path d="M 310 88 L 400 88 L 400 120 A 13 13 0 0 1 400 146 L 400 178 L 310 178 L 310 146 A 13 13 0 0 0 310 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="355" y="149" stroke="none">R</text>
        </g>
      </g>
      <!-- K : socket left, flat right -->
      <g opacity="0" transform="translate(0,-34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.39s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 -34; 0 5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.39s" fill="freeze" />
        <g transform="rotate(7 445 133)">
          <animateTransform attributeName="transform" type="rotate" values="7 445 133; -3 445 133; 0 445 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.39s" fill="freeze" />
          <path d="M 400 88 L 490 88 L 490 178 L 400 178 L 400 146 A 13 13 0 0 0 400 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="445" y="149" stroke="none">K</text>
        </g>
      </g>
      <!-- C : flat left, tab right -->
      <g opacity="0" transform="translate(0,34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.87s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.87s" fill="freeze" />
        <g transform="rotate(-6 575 133)">
          <animateTransform attributeName="transform" type="rotate" values="-6 575 133; 3 575 133; 0 575 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.87s" fill="freeze" />
          <path d="M 530 88 L 620 88 L 620 120 A 13 13 0 0 1 620 146 L 620 178 L 530 178 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="575" y="149" stroke="none">C</text>
        </g>
      </g>
      <!-- H : socket left, tab right -->
      <g opacity="0" transform="translate(0,-34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.63s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 -34; 0 5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.63s" fill="freeze" />
        <g transform="rotate(6 665 133)">
          <animateTransform attributeName="transform" type="rotate" values="6 665 133; -3 665 133; 0 665 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.63s" fill="freeze" />
          <path d="M 620 88 L 710 88 L 710 120 A 13 13 0 0 1 710 146 L 710 178 L 620 178 L 620 146 A 13 13 0 0 0 620 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="665" y="149" stroke="none">H</text>
        </g>
      </g>
      <!-- W : socket left, tab right -->
      <g opacity="0" transform="translate(0,34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.11s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="1.11s" fill="freeze" />
        <g transform="rotate(-7 755 133)">
          <animateTransform attributeName="transform" type="rotate" values="-7 755 133; 3 755 133; 0 755 133" keyTimes="0;0.7;1" dur="0.5s" begin="1.11s" fill="freeze" />
          <path d="M 710 88 L 800 88 L 800 120 A 13 13 0 0 1 800 146 L 800 178 L 710 178 L 710 146 A 13 13 0 0 0 710 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="755" y="149" stroke="none">W</text>
        </g>
      </g>
      <!-- E : socket left, tab right -->
      <g opacity="0" transform="translate(0,-34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.75s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 -34; 0 5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.75s" fill="freeze" />
        <g transform="rotate(6 845 133)">
          <animateTransform attributeName="transform" type="rotate" values="6 845 133; -3 845 133; 0 845 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.75s" fill="freeze" />
          <path d="M 800 88 L 890 88 L 890 120 A 13 13 0 0 1 890 146 L 890 178 L 800 178 L 800 146 A 13 13 0 0 0 800 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="845" y="149" stroke="none">E</text>
        </g>
      </g>
      <!-- Y : socket left, tab right -->
      <g opacity="0" transform="translate(0,34)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.99s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -5; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.5s" begin="0.99s" fill="freeze" />
        <g transform="rotate(-6 935 133)">
          <animateTransform attributeName="transform" type="rotate" values="-6 935 133; 3 935 133; 0 935 133" keyTimes="0;0.7;1" dur="0.5s" begin="0.99s" fill="freeze" />
          <path d="M 890 88 L 980 88 L 980 120 A 13 13 0 0 1 980 146 L 980 178 L 890 178 L 890 146 A 13 13 0 0 0 890 120 Z" fill="#f1f5f9" stroke="#94a3b8" />
          <text x="935" y="149" stroke="none">Y</text>
        </g>
      </g>
      <!-- A : the final piece â€” slides in from the right and locks in -->
      <g opacity="0" transform="translate(150,0)">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate" values="150 0; -8 0; 0 0" keyTimes="0;0.7;1" calcMode="spline" keySplines="0.3 0 0.4 1;0.5 0 0.5 1" dur="0.6s" begin="1.5s" fill="freeze" />
        <g transform="rotate(-12 1025 133)">
          <animateTransform attributeName="transform" type="rotate" values="-12 1025 133; 4 1025 133; 0 1025 133" keyTimes="0;0.7;1" dur="0.6s" begin="1.5s" fill="freeze" />
          <path d="M 980 88 L 1070 88 L 1070 178 L 980 178 L 980 146 A 13 13 0 0 0 980 120 Z" fill="url(#accent)" stroke="none" />
          <text x="1025" y="149" fill="#ffffff" stroke="none">A</text>
        </g>
      </g>
    </g>

    <text x="600" y="242" font-size="19" fill="#475569">Building AI products and modern digital experiences</text>

    <g font-size="14" font-weight="600" letter-spacing="5" fill="url(#accent)">
      <text x="600" y="284" opacity="0">SOFTWARE DEVELOPER
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="0s" repeatCount="indefinite" />
      </text>
      <text x="600" y="284" opacity="0">AI BUILDER
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="4s" repeatCount="indefinite" />
      </text>
      <text x="600" y="284" opacity="0">DATA SCIENTIST
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="8s" repeatCount="indefinite" />
      </text>
      <text x="600" y="284" opacity="0">DATA ANALYST
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="16s" begin="12s" repeatCount="indefinite" />
      </text>
    </g>
  </g>
</svg>
