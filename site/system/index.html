<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Chweya · Repository System</title>
<meta name="description" content="Mark Chweya's public repositories as an interactive solar system. Hover a planet to see what the project is about.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --ink: #1a1c22; --light: #e9e6df; --silver: #c9ccd3; --slate: #7d8597;
    --amber: #ffb347; --ember: #d9480f;
    --sans: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--light); overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  #stage { position: fixed; inset: 0; }
  header {
    position: fixed; top: 24px; left: 28px; right: 28px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 16px; pointer-events: none; z-index: 3;
  }
  header h1 { margin: 0; font: 800 clamp(20px, 3vw, 30px)/1 'Syne', var(--sans); letter-spacing: .06em; }
  header p { margin: 8px 0 0; font: 500 12px/1.4 var(--mono); letter-spacing: .14em; color: var(--silver); text-transform: uppercase; }
  header a { pointer-events: auto; color: var(--silver); font: 500 12px var(--mono); letter-spacing: .12em;
    text-decoration: none; border-bottom: 1px solid rgba(201,204,211,.3); padding-bottom: 2px; white-space: nowrap; }
  header a:hover, header a:focus-visible { color: var(--amber); border-color: var(--amber); outline: none; }

  .label {
    position: fixed; left: 0; top: 0; transform: translate(-50%, 0); text-align: center; pointer-events: none;
    z-index: 2; transition: opacity .35s ease; white-space: nowrap; will-change: transform;
  }
  .label b { display: block; font: 700 15px/1.1 var(--sans); color: var(--light); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .label span { display: block; margin-top: 3px; font: 500 10.5px var(--mono); letter-spacing: .08em; color: #9fb0c8; }
  .label.dim { opacity: .35; }
  .label.hot { opacity: 0; }

  #card {
    position: fixed; left: 0; top: 0; width: min(340px, calc(100vw - 32px)); padding: 18px 20px 16px;
    border-radius: 14px; background: rgba(17, 21, 29, .86); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(201,204,211,.12), 0 18px 48px rgba(0,0,0,.55), 0 0 60px -20px var(--glow, #ffb347);
    opacity: 0; transform: translateY(6px) scale(.98); transition: opacity .22s ease, transform .22s ease;
    pointer-events: none; z-index: 4;
  }
  #card.on { opacity: 1; transform: none; pointer-events: auto; }
  #card .kicker { font: 500 10.5px var(--mono); letter-spacing: .16em; color: var(--slate); text-transform: uppercase; }
  #card h2 { margin: 6px 0 8px; font: 700 21px/1.15 var(--sans); }
  #card p { margin: 0 0 12px; font: 500 14px/1.5 var(--sans); color: #c6cad3; }
  #card p.none { color: var(--slate); font-style: italic; }
  #card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 11.5px var(--mono); color: var(--silver); }
  #card .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #card .topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  #card .topics span { font: 500 10.5px var(--mono); padding: 3px 8px; border-radius: 99px; background: rgba(125,133,151,.16); color: #b9c2d3; }
  #card a.go { display: inline-block; margin-top: 14px; font: 500 12px var(--mono); letter-spacing: .1em; color: var(--amber); text-decoration: none; }
  #card a.go:hover, #card a.go:focus-visible { text-decoration: underline; outline: none; }

  nav#list {
    position: fixed; left: 28px; bottom: 22px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 3; max-width: calc(100vw - 56px);
  }
  nav#list button {
    font: 500 11px var(--mono); letter-spacing: .06em; color: var(--silver); background: rgba(125,133,151,.10);
    border: 1px solid rgba(125,133,151,.22); border-radius: 99px; padding: 6px 12px; cursor: pointer;
  }
  nav#list button:hover, nav#list button:focus-visible, nav#list button[aria-pressed="true"] {
    color: var(--bg); background: var(--amber); border-color: var(--amber); outline: none;
  }
  .hint { position: fixed; right: 28px; bottom: 26px; font: 500 11px var(--mono); letter-spacing: .14em; color: var(--slate); z-index: 3; }
  @media (max-width: 640px) {
    header { top: 16px; left: 16px; right: 16px; }
    nav#list { left: 16px; bottom: 16px; }
    .hint { display: none; }
    .label b { font-size: 12.5px; } .label span { display: none; }
  }
  body.capture header, body.capture nav#list, body.capture .hint { display: none; }
  body.capture *, body.capture #card { transition: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<header>
  <div>
    <h1>MARK CHWEYA</h1>
    <p>Public repositories · hover a planet</p>
  </div>
  <a href="https://github.com/markchweya">← BACK TO GITHUB</a>
</header>
<div id="labels"></div>
<article id="card" role="dialog" aria-live="polite" aria-label="Project details"></article>
<nav id="list" aria-label="Projects"></nav>
<div class="hint">CLICK A PLANET TO OPEN IT</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// ------------------------------------------------------------------ data
// Same worlds, same order (inner -> outer) as the rendered solar system on the profile README.
const LOGIN = "markchweya";
const SYSTEM = ["kukilabs", "sdmx-data-mcp", "sentinel-browser", "malwarefinder", "Dumonda", "VectorWatch"];
// Repo facts are refreshed daily by the profile's GitHub Action; the public API is the fallback.
const FACTS_URL = `https://raw.githubusercontent.com/${LOGIN}/${LOGIN}/main/assets/space/repos.json`;

async function loadFacts() {
  const byName = {};
  try {
    const r = await fetch(FACTS_URL, { cache: "no-cache" });
    if (r.ok) for (const repo of (await r.json()).repos) byName[repo.name.toLowerCase()] = repo;
  } catch (_) { /* fall through to the public API */ }
  await Promise.all(SYSTEM.map(async (name) => {
    if (byName[name.toLowerCase()]) return;
    try {
      const r = await fetch(`https://api.github.com/repos/${LOGIN}/${name}`);
      if (!r.ok) return;
      const j = await r.json();
      byName[name.toLowerCase()] = {
        name: j.name, description: j.description, language: j.language, color: null,
        stars: j.stargazers_count, url: j.html_url, homepage: j.homepage || null,
        updated: (j.pushed_at || "").slice(0, 10) || null, topics: j.topics || [],
      };
    } catch (_) { /* leave it as a bare planet */ }
  }));
  return SYSTEM.map((name) => byName[name.toLowerCase()] ||
    { name, description: null, language: null, color: null, stars: null, url: `https://github.com/${LOGIN}/${name}`, topics: [] });
}

// ------------------------------------------------------------------ scene
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// ?capture renders the README "auto-tour" frame by frame: no chrome, no pointer, fixed time steps
const CAPTURE = new URLSearchParams(location.search).has("capture");
if (CAPTURE) document.body.classList.add("capture");
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0d1117");
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const CAM_BASE = new THREE.Vector3(0, 7.2, 19.5);
camera.position.copy(CAM_BASE);
camera.lookAt(0, -0.4, 0);

scene.add(new THREE.AmbientLight("#5c6577", 0.95));
const sunLight = new THREE.PointLight("#ffc27a", 240, 0, 2);
scene.add(sunLight);

// star field
{
  const g = new THREE.BufferGeometry(), n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 60 + Math.random() * 120, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
  }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: "#d9dce3", size: 0.22, sizeAttenuation: true, transparent: true, opacity: .8 })));
}

// sun: animated granulation with limb darkening, plus an additive corona sprite
const noiseGLSL = `
  vec3 hash3(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
    return -1.0 + 2.0*fract(sin(p)*43758.5453123); }
  float noise(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
    return mix(mix(mix(dot(hash3(i),f), dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                   mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
               mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                   mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
  float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=.5; } return s; }`;
const SUN_R = 1.5;
const sunMat = new THREE.ShaderMaterial({
  // noise offsets (set per frame): a drift in the live page, a closed circle in capture mode so it loops
  uniforms: { uOff: { value: new THREE.Vector3() }, uOff2: { value: new THREE.Vector3() } },
  vertexShader: `varying vec3 vPos; varying vec3 vN; varying vec3 vView;
    void main(){ vPos = position; vN = normalize(normalMatrix*normal);
      vec4 mv = modelViewMatrix*vec4(position,1.0); vView = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 uOff; uniform vec3 uOff2; varying vec3 vPos; varying vec3 vN; varying vec3 vView; ${noiseGLSL}
    void main(){
      float g = fbm(vPos*2.4 + uOff) * .5 + .5;
      g = smoothstep(.25, .8, g + .12*fbm(vPos*7.0 + uOff2));
      vec3 ember = vec3(.80,.36,.12), amber = vec3(1.0,.72,.40), gold = vec3(1.0,.90,.74);
      vec3 c = mix(ember, amber, smoothstep(.0,.45,g)); c = mix(c, gold, smoothstep(.4,.9,g));
      float limb = pow(max(dot(vN, vView), 0.0), .5);
      gl_FragColor = vec4(c * (0.42 + 0.62*limb), 1.0);
    }`,
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 96, 64), sunMat);
scene.add(sun);

function glowTexture(stops) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const corona = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture([[0, "rgba(255,190,110,.95)"], [.22, "rgba(255,160,70,.55)"], [.5, "rgba(217,72,15,.18)"], [1, "rgba(217,72,15,0)"]]),
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true,
}));
corona.scale.set(SUN_R * 7.5, SUN_R * 7.5, 1);
scene.add(corona);

// planet surface: a small procedural texture, banded and speckled, so its spin is visible
function planetTexture(hex, seed) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const x = c.getContext("2d"), base = new THREE.Color(hex);
  let s = seed * 9301 + 49297; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  for (let y = 0; y < 256; y++) {
    const band = Math.sin(y * 0.07 + seed) * .5 + Math.sin(y * 0.21 + seed * 3) * .25;
    const col = base.clone().offsetHSL(0, -.05, band * .09);
    x.fillStyle = `#${col.getHexString()}`; x.fillRect(0, y, 512, 1);
  }
  for (let i = 0; i < 260; i++) {
    const r = 2 + rnd() * 16, px = rnd() * 512, py = 20 + rnd() * 216;
    x.fillStyle = `rgba(${rnd() < .5 ? "255,255,255" : "0,0,0"},${.04 + rnd() * .08})`;
    x.beginPath(); x.ellipse(px, py, r * 2.2, r * .7, 0, 0, Math.PI * 2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; return t;
}

const SLATE = new THREE.Color("#7d8597");
const LANG_FALLBACK = { TypeScript: "#3178c6", JavaScript: "#f1e05a", Python: "#3572A5", HTML: "#e34c26", CSS: "#563d7c" };
const RADII = [3.0, 3.85, 4.7, 5.55, 6.4, 7.25];
const TILT = THREE.MathUtils.degToRad(14);
const WOBBLE = [[2, -3], [-3.5, 2], [1.5, 4], [-2, -2.5], [3, 1.5], [-1.5, -4]];
const BASE_SPEED = 0.16;                       // rad/s on the innermost orbit
const planets = [];
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2(-9, -9);

function buildPlanets(facts) {
  facts.forEach((f, k) => {
    const plane = new THREE.Group();
    plane.rotation.set(TILT + THREE.MathUtils.degToRad(WOBBLE[k][0]), 0, THREE.MathUtils.degToRad(WOBBLE[k][1]));
    scene.add(plane);
    const rad = RADII[k];
    const ring = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(Array.from({ length: 256 }, (_, i) =>
        new THREE.Vector3(Math.cos(i / 256 * Math.PI * 2) * rad, 0, Math.sin(i / 256 * Math.PI * 2) * rad))),
      new THREE.LineBasicMaterial({ color: "#8a93a6", transparent: true, opacity: .32 }));
    plane.add(ring);

    const hue = new THREE.Color(f.color || LANG_FALLBACK[f.language] || "#7d8597").lerp(SLATE, .25);
    const size = 0.42 - 0.03 * k;
    const pivot = new THREE.Group();            // carries the planet round the orbit
    plane.add(pivot);
    const body = new THREE.Mesh(new THREE.SphereGeometry(size, 64, 48),
      new THREE.MeshStandardMaterial({ map: planetTexture(hue.getHex(), k + 1), roughness: .62, metalness: .05 }));
    body.rotation.z = THREE.MathUtils.degToRad(18);
    pivot.add(body);
    if (k < 2) {
      const pr = new THREE.Mesh(new THREE.RingGeometry(size * 1.45, size * 1.9, 96),
        new THREE.MeshBasicMaterial({ color: hue.clone().lerp(new THREE.Color("#e9e6df"), .45), transparent: true, opacity: .55, side: THREE.DoubleSide }));
      pr.rotation.x = THREE.MathUtils.degToRad(72);
      pivot.add(pr);
    }
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture([[0, `rgba(255,214,150,.0)`], [.45, "rgba(255,190,110,.0)"], [.62, "rgba(255,190,110,.55)"], [1, "rgba(255,190,110,0)"]]),
      blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0,
    }));
    halo.scale.set(size * 4.2, size * 4.2, 1);
    pivot.add(halo);
    const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(size * 2.4, .9), 12, 8),
      new THREE.MeshBasicMaterial({ visible: false }));
    hit.userData.index = k;
    pivot.add(hit);

    const label = document.createElement("div");
    label.className = "label";
    label.innerHTML = `<b></b><span></span>`;
    label.querySelector("b").textContent = f.name;
    label.querySelector("span").textContent = f.language ? f.language.toLowerCase() : "public repository";
    document.getElementById("labels").appendChild(label);

    const btn = document.createElement("button");
    btn.textContent = f.name; btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("mouseenter", () => setFocus(k, "list"));
    btn.addEventListener("focus", () => setFocus(k, "list"));
    btn.addEventListener("mouseleave", () => setFocus(null, "list"));
    btn.addEventListener("blur", () => setFocus(null, "list"));
    btn.addEventListener("click", () => open(f.url, "_blank", "noopener"));
    document.getElementById("list").appendChild(btn);

    planets.push({
      facts: f, plane, pivot, body, halo, hit, label, btn, rad,
      angle: (k * 2.39996) % (Math.PI * 2),     // golden-angle spread
      speed: BASE_SPEED * Math.pow(RADII[0] / rad, 1.5),
      orbitMul: 1, spin: 0.25, glow: 0,
    });
  });
}

// ------------------------------------------------------------------ hover focus
let focused = null, focusSource = null;
const card = document.getElementById("card");
const fmtDate = (d) => d ? new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", year: "numeric" }) : null;

function fillCard(p) {
  const f = p.facts;
  const color = f.color || LANG_FALLBACK[f.language] || "#7d8597";
  card.style.setProperty("--glow", color);
  card.innerHTML = "";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  card.append(el("div", "kicker", `Planet ${planets.indexOf(p) + 1} of ${planets.length} · public repository`));
  card.append(el("h2", null, f.name));
  card.append(f.description ? el("p", null, f.description) : el("p", "none", "Explore the code on GitHub."));
  if (f.topics && f.topics.length) {
    const t = el("div", "topics"); f.topics.slice(0, 5).forEach((x) => t.append(el("span", null, x))); card.append(t);
  }
  const meta = el("div", "meta");
  if (f.language) { const s = el("span"); const d = el("i", "dot"); d.style.background = color; s.append(d, f.language); meta.append(s); }
  if (f.stars) meta.append(el("span", null, `★ ${f.stars}`));
  if (f.updated) meta.append(el("span", null, `updated ${fmtDate(f.updated)}`));
  card.append(meta);
  const a = el("a", "go", "OPEN REPOSITORY ↗"); a.href = f.url; a.target = "_blank"; a.rel = "noopener"; card.append(a);
  if (f.homepage) { const h = el("a", "go", "  ·  LIVE SITE ↗"); h.href = f.homepage; h.target = "_blank"; h.rel = "noopener"; card.append(h); }
}

function setFocus(k, source) {
  if (k === null) { if (focusSource !== source && source !== "force") return; focused = null; focusSource = null; }
  else { if (focused !== planets[k]) fillCard(planets[k]); focused = planets[k]; focusSource = source; }
  card.classList.toggle("on", !!focused);
  planets.forEach((p) => {
    p.btn.setAttribute("aria-pressed", String(p === focused));
    p.label.classList.toggle("dim", !!focused && p !== focused);
    p.label.classList.toggle("hot", p === focused);
  });
  renderer.domElement.style.cursor = focused ? "pointer" : "default";
}

let cardHover = false, lostAt = null;
card.addEventListener("mouseenter", () => { cardHover = true; });
card.addEventListener("mouseleave", () => { cardHover = false; });

addEventListener("pointermove", (e) => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
renderer.domElement.addEventListener("pointerleave", () => pointer.set(-9, -9));
renderer.domElement.addEventListener("click", () => { if (focused && focusSource === "pointer") open(focused.facts.url, "_blank", "noopener"); });
// touch: a tap on a planet focuses it; a tap on empty space clears
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const k = pick();
  if (k === null) setFocus(null, "force"); else setFocus(k, "touch");
});

function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(planets.map((p) => p.hit), false);
  return hits.length ? hits[0].object.userData.index : null;
}

// ------------------------------------------------------------------ layout + loop
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // pull back on narrow screens so the outer orbit stays in frame
  camera.fov = (w / h < 1 ? 38 + (1 - w / h) * 34 : 38) + (CAPTURE ? 3 : 0);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
const lerp = (a, b, t) => a + (b - a) * t;

// tour timeline for capture mode: each planet gets a slot; it is featured for most of it
const TOUR_SLOT = 7, TOUR_ON = [0.9, 6.2];
const tourFocus = (t) => {
  const s = t % (TOUR_SLOT * planets.length), k = Math.floor(s / TOUR_SLOT), u = s - k * TOUR_SLOT;
  return u > TOUR_ON[0] && u < TOUR_ON[1] ? k : null;
};

function update(dt, t, loopPhase = null) {
  const motion = reduceMotion && !CAPTURE ? 0.25 : 1;
  if (loopPhase === null) {
    sunMat.uniforms.uOff.value.set(0, t * 0.05 * motion, t * 0.03 * motion);
    sunMat.uniforms.uOff2.value.setScalar(-t * 0.08 * motion);
    sun.rotation.y += dt * 0.05 * motion;
  } else {                                       // closed loops, so the capture repeats seamlessly
    const a = loopPhase * Math.PI * 2;
    sunMat.uniforms.uOff.value.set(Math.cos(a) * .45, Math.sin(a) * .45, 0);
    sunMat.uniforms.uOff2.value.set(Math.sin(a) * .3, 0, Math.cos(a) * .3);
    sun.rotation.y = a;
  }

  if (CAPTURE) {
    const k = tourFocus(t);
    if (k === null ? focused : focused !== planets[k]) { if (k === null) setFocus(null, "force"); else setFocus(k, "tour"); }
  } else if (focusSource !== "list" && focusSource !== "touch" && !cardHover) {
    const k = pick();
    if (k !== null) { lostAt = null; setFocus(k, "pointer"); }
    else if (focusSource === "pointer") {
      // short grace period so the pointer can travel from the planet onto its card
      lostAt ??= t;
      if (t - lostAt > 0.4) { lostAt = null; setFocus(null, "pointer"); }
    }
  }

  const ease = 1 - Math.exp(-dt * 5);
  const slow = CAPTURE ? 0.3 : 0.16;
  for (const p of planets) {
    const isHot = p === focused;
    // featured world parks on its orbit and turns on its axis; the rest keep going, slowly
    p.orbitMul = lerp(p.orbitMul, focused ? (isHot ? 0 : slow) : 1, ease);
    p.spin = lerp(p.spin, isHot ? 1.6 : 0.25, ease);
    p.glow = lerp(p.glow, isHot ? 1 : 0, ease);
    p.dim = lerp(p.dim ?? 0, focused && !isHot ? 1 : 0, ease);
    p.angle += p.speed * (p.speedScale ?? 1) * p.orbitMul * dt * motion;
    p.turn = (p.turn ?? 0) + p.spin * (p.spinScale ?? 1) * dt * motion;
    p.pivot.position.set(Math.cos(p.angle) * p.rad, 0, Math.sin(p.angle) * p.rad);
    p.body.rotation.y = p.turn;
    p.halo.material.opacity = p.glow;
    p.body.scale.setScalar(1 + 0.18 * p.glow);
    if (CAPTURE) p.label.style.opacity = String((1 - p.glow) * (1 - .65 * p.dim));

    p.body.getWorldPosition(tmp);
    const r = p.body.geometry.parameters.radius * (1 + 0.18 * p.glow);
    tmp.y -= r * 1.6;
    tmp.project(camera);
    const x = (tmp.x * .5 + .5) * innerWidth, y = (-tmp.y * .5 + .5) * innerHeight;
    p.label.style.transform = `translate(${x.toFixed(1)}px, ${(y + 6).toFixed(1)}px) translate(-50%, 0)`;
  }

  if (CAPTURE) {
    cardAlpha = lerp(cardAlpha, focused ? 1 : 0, 1 - Math.exp(-dt * 7));
    card.style.opacity = String(cardAlpha);
    card.style.transform = `translateY(${(1 - cardAlpha) * 6}px)`;
  }
  if (focused) {
    // keep the card beside its planet, flipped to whichever side has room
    focused.body.getWorldPosition(tmp); tmp.project(camera);
    const px = (tmp.x * .5 + .5) * innerWidth, py = (-tmp.y * .5 + .5) * innerHeight;
    const cw = card.offsetWidth, ch = card.offsetHeight, gap = 46;
    let cx = px + gap; if (cx + cw > innerWidth - 16) cx = px - gap - cw;
    cx = Math.max(16, Math.min(cx, innerWidth - cw - 16));
    const top = CAPTURE ? 104 : 84, bottom = CAPTURE ? 90 : 70;
    const cy = Math.max(top, Math.min(py - ch / 2, innerHeight - ch - bottom));
    card.style.left = `${cx}px`; card.style.top = `${cy}px`;
  }

  // gentle parallax from the pointer, never when reduced motion is requested
  if (!CAPTURE && !reduceMotion && pointer.x > -2) {
    camera.position.x = lerp(camera.position.x, CAM_BASE.x + pointer.x * 0.8, ease * .3);
    camera.position.y = lerp(camera.position.y, CAM_BASE.y + pointer.y * 0.5, ease * .3);
    camera.lookAt(0, -0.4, 0);
  }
}
let cardAlpha = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt, clock.elapsedTime);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Capture API (used by tools/capture_tour.js). One tour = every planet featured once. Speeds are
// rescaled so each planet makes whole turns per tour, which makes the recorded loop seamless.
window.__tour = {
  prepare(fps) {
    const T = TOUR_SLOT * planets.length, n = Math.round(T * fps), dt = 1 / fps;
    const run = (measure) => {
      const a0 = planets.map((p) => p.angle), s0 = planets.map((p) => p.turn ?? 0);
      for (let i = 0; i < n; i++) update(dt, i * dt, i / n);
      return planets.map((p, k) => [p.angle - a0[k], (p.turn ?? 0) - s0[k]]);
    };
    run();                                         // settle the easing state
    const d = run();                               // what one tour adds, at the base speeds
    planets.forEach((p, k) => {
      p.speedScale = (2 * Math.PI * Math.max(1, Math.round(d[k][0] / (2 * Math.PI)))) / d[k][0];
      p.spinScale = (2 * Math.PI * Math.max(1, Math.round(d[k][1] / (2 * Math.PI)))) / d[k][1];
    });
    run();
    this.n = n; this.dt = dt; this.i = 0;
    return n;
  },
  step() { update(this.dt, this.i * this.dt, this.i / this.n); renderer.render(scene, camera); this.i++; },
};

loadFacts().then((facts) => {
  buildPlanets(facts);
  if (CAPTURE) { window.__ready = true; renderer.render(scene, camera); } else requestAnimationFrame(frame);
});
</script>
</body>
